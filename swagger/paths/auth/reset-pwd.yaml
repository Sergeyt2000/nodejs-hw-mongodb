tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Reset user password using token from email'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'Token received via email'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ODg4Y2MzOTBiOGM2ZTVjZTNjOWY4MWEiLCJlbWFpbCI6InNlcmdleXQyMDAwQGdtYWlsLmNvbSIsImlhdCI6MTc1NDA2ODI0NCwiZXhwIjoxNzU0MDY4NTQ0fQ.4mX1VKQ9VOTGIvRf_-AAt6Nixgub3J1JRaGoN3FmfIQ'
          password:
            description: 'New user password'
            type: string
            example: 'ca6aka!ghbrjk'
responses:
  '200':
    description: 'Password has been successfully reset.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
              properties: {}
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
