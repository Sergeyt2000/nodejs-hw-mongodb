type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: +380501234567
  email:
    description: "Contact's email"
    type: string
    example: 'example@example.com'
  isFavourite:
    description: 'Is contact favourite'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    default: personal
  userId:
    description: "Contact's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    default: null
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    description: "Contact's creation date"
    type: string
    format: date-time
    example: '2025-07-24T10:55:43.256+00:00'
  updatedAt:
    description: "Contact's last update date"
    type: string
    format: date-time
    example: '2025-07-24T12:46:51.328+00:00'
